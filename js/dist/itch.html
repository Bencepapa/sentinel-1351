<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sentinel</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

/* The selector shows the whole 384:272 picture. A game shows its 200 pixel rows, the C64's display window (rows 36-235
   of the 272, the black border above and below is cut off), at the largest size that fits: the screen's width or
   height, whichever comes first. Where it goes: see TOUCH CONTROLS below. --W x --H = the viewport. */
:root { --W: 100vw; --H: 100vh; }
@supports (height: 100dvh) { :root { --H: 100dvh; } }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: flex-start; touch-action: none; outline: none; box-sizing: border-box; }
/* the mouse pointer is hidden only by the browser while the mouse is captured (pointer lock) */
#box { position: relative; --gw: min(var(--W), calc(var(--H) * 384 / 272)); width: var(--gw); aspect-ratio: 384 / 272; flex: none; overflow: hidden;
  margin-left: min(calc(var(--W) - var(--gw)), calc((var(--W) - var(--gw) + var(--tcol, 0px)) / 2)); }     /* (centred: --tcol is 0) */
#vic, #ov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#vic { image-rendering: crisp-edges; image-rendering: pixelated; }
#ov { pointer-events: none; }
body.ingame #box { --gw: min(var(--W), calc(var(--H) * 384 / 200)); aspect-ratio: 384 / 200; }
body.ingame #vic { top: -18%; height: 136%; }                                    /* the 272 rows, shifted up by 36 of 200 */

/* ---- TOUCH CONTROLS: edit the look here ------------------------------------------------
   Shown on touch devices while a game runs, at the bottom left. Landscape: a vertical stack, PROTON, MAP, FIRE
   from the top (FIRE nearest to the thumb, MAP between, so a proton torpedo is never thrown by accident).
   Portrait: one row, FIRE at the far left, then MAP, then PROTON, at thumb height (--tlift from the bottom).
   --tgap is the space between the buttons. FIRE = left mouse button, MAP = right, PROTON = both. Aiming is a drag
   anywhere else on the screen. Landscape: the game fills the screen top to bottom (or the full width where the
   screen is less wide than the picture) and is centred in the area right of the buttons (--tcol wide); it slides
   under the buttons where it is wider than that. Portrait: the picture fills the width, --ttop from the top. */
body.touch.ingame { --tcol: calc(max(14px, env(safe-area-inset-left, 0px)) + 112px); --tgap: 26px; --ttop: calc(max(10px, env(safe-area-inset-top, 0px)) + 14px); }
#tpad { display: none; position: fixed; z-index: 3; pointer-events: none;      /* (the gaps pass touches on) */
  left: max(14px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  flex-direction: column; align-items: center; gap: var(--tgap, 26px); }
@media (orientation: portrait) {
  body.touch.ingame { --tcol: 0px; }
  body.touch.ingame #stage { align-items: flex-start; padding-top: var(--ttop); }
  #tpad { flex-direction: row-reverse; --tlift: calc(var(--H) * 0.2); bottom: max(max(14px, env(safe-area-inset-bottom, 0px)), var(--tlift)); }   /* FIRE, MAP, PROTON from the left */
}
body.touch.ingame #tpad { display: flex; }
.tbtn { position: relative; pointer-events: auto; box-sizing: border-box; padding: 0; margin: 0;
  border: 4px solid var(--tc); background: rgba(0, 0, 0, 0.32); color: var(--tc);
  font: 900 15px/1 system-ui, sans-serif; letter-spacing: 0.06em; text-shadow: 0 0 2px #000;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.tbtn::after { content: ''; position: absolute; inset: -6px; }                  /* a roomier hit area than the ring (the gaps are wider than 2 x 6 px) */
.tbtn.down { background: color-mix(in srgb, var(--tc) 38%, transparent); }
.tsmall { width: 100px; height: 46px; border-radius: 14px; }                    /* MAP, PROTON: rounded rectangles */
#b-map { --tc: #ffd23f; }                                                       /* yellow: the map */
#b-proton { --tc: #ffffff; }                                                    /* white: the proton torpedo */
#tsys { display: flex; flex-direction: row; gap: 12px; pointer-events: none; }   /* PAUSE and >>: side by side in landscape (above PROTON), stacked in portrait (after PROTON) */
@media (orientation: portrait) { #tsys { flex-direction: column; } }
.tsys { --tc: #a8a8a8; width: 50px; height: 40px; border-width: 3px; border-radius: 10px; font-size: 11px; letter-spacing: 0.02em; }
#b-fire { --tc: #ff4a3a; width: 88px; height: 88px; border-radius: 50%; border-width: 6px; font-size: 22px; letter-spacing: 0.04em; }
/* ---- end of touch controls ------------------------------------------------------------- */
</style>
</head>

// 6502 / 8502 core: all documented opcodes, decimal mode, cycle counts with
// page-crossing penalties. Undocumented opcodes halt the CPU (cpu.jam).
// Memory goes through bus.read(addr) / bus.write(addr, value).
'use strict';

var CPU6502 = (function () {
  var C = 1, Z = 2, I = 4, D = 8, B = 16, U = 32, V = 64, N = 128;

  function CPU(bus) {
    this.bus = bus;
    this.a = 0; this.x = 0; this.y = 0;
    this.sp = 0xFF; this.pc = 0; this.p = U | I;
    this.cycles = 0;
    this.jam = null;
  }

  var P = CPU.prototype;

  P.rd = function (a) { return this.bus.read(a & 0xFFFF); };
  P.wr = function (a, v) { this.bus.write(a & 0xFFFF, v & 0xFF); };
  P.rd16 = function (a) { return this.rd(a) | (this.rd(a + 1) << 8); };
  // JMP (ind) page wrap bug
  P.rd16bug = function (a) { return this.rd(a) | (this.rd((a & 0xFF00) | ((a + 1) & 0xFF)) << 8); };
  P.push = function (v) { this.wr(0x100 | this.sp, v); this.sp = (this.sp - 1) & 0xFF; };
  P.pull = function () { this.sp = (this.sp + 1) & 0xFF; return this.rd(0x100 | this.sp); };
  P.nz = function (v) { this.p = (this.p & ~(N | Z)) | (v & N) | (v ? 0 : Z); return v; };

  // ---- addressing: each returns an effective address (and sets this.extra)
  P.imm = function () { return this.pc++; };
  P.zp = function () { return this.rd(this.pc++); };
  P.zpx = function () { return (this.rd(this.pc++) + this.x) & 0xFF; };
  P.zpy = function () { return (this.rd(this.pc++) + this.y) & 0xFF; };
  P.abs = function () { var a = this.rd16(this.pc); this.pc += 2; return a; };
  P.abx = function (pen) {
    var b = this.rd16(this.pc); this.pc += 2; var a = (b + this.x) & 0xFFFF;
    if (pen && ((a ^ b) & 0xFF00)) this.cycles++; return a;
  };
  P.aby = function (pen) {
    var b = this.rd16(this.pc); this.pc += 2; var a = (b + this.y) & 0xFFFF;
    if (pen && ((a ^ b) & 0xFF00)) this.cycles++; return a;
  };
  P.izx = function () {
    var z = (this.rd(this.pc++) + this.x) & 0xFF;
    return this.rd(z) | (this.rd((z + 1) & 0xFF) << 8);
  };
  P.izy = function (pen) {
    var z = this.rd(this.pc++);
    var b = this.rd(z) | (this.rd((z + 1) & 0xFF) << 8);
    var a = (b + this.y) & 0xFFFF;
    if (pen && ((a ^ b) & 0xFF00)) this.cycles++; return a;
  };

  // ---- ALU
  P.adc = function (m) {
    var a = this.a, c = this.p & C, r;
    if (this.p & D) {
      var lo = (a & 0x0F) + (m & 0x0F) + c;
      var hi = (a & 0xF0) + (m & 0xF0);
      if (lo > 9) { lo += 6; }
      if (lo > 0x0F) hi += 0x10;
      var zbin = ((a + m + c) & 0xFF) === 0;
      this.p &= ~(N | V | Z | C);
      if (zbin) this.p |= Z;
      if (hi & 0x80) this.p |= N;
      if (~(a ^ m) & (a ^ hi) & 0x80) this.p |= V;
      if (hi > 0x90) hi += 0x60;
      if (hi > 0xFF) this.p |= C;
      this.a = ((hi & 0xF0) | (lo & 0x0F)) & 0xFF;
      return;
    }
    r = a + m + c;
    this.p &= ~(C | V);
    if (r > 0xFF) this.p |= C;
    if (~(a ^ m) & (a ^ r) & 0x80) this.p |= V;
    this.a = this.nz(r & 0xFF);
  };
  P.sbc = function (m) {
    var a = this.a, c = this.p & C, r = a - m - (1 - c);
    var bin = r & 0xFF;
    this.p &= ~(C | V);
    if (r >= 0) this.p |= C;
    if ((a ^ m) & (a ^ bin) & 0x80) this.p |= V;
    this.nz(bin);
    if (this.p & D) {
      var lo = (a & 0x0F) - (m & 0x0F) - (1 - c);
      var hi = (a & 0xF0) - (m & 0xF0);
      if (lo & 0x10) { lo -= 6; hi -= 0x10; }
      if (hi & 0x100) hi -= 0x60;
      this.a = ((hi & 0xF0) | (lo & 0x0F)) & 0xFF;
    } else {
      this.a = bin;
    }
  };
  P.cmp = function (r, m) {
    var t = r - m;
    this.p = (this.p & ~C) | (t >= 0 ? C : 0);
    this.nz(t & 0xFF);
  };
  P.bit = function (m) {
    this.p = (this.p & ~(N | V | Z)) | (m & (N | V)) | ((this.a & m) ? 0 : Z);
  };
  P.asl = function (v) { this.p = (this.p & ~C) | ((v >> 7) & 1); return this.nz((v << 1) & 0xFF); };
  P.lsr = function (v) { this.p = (this.p & ~C) | (v & 1); return this.nz(v >> 1); };
  P.rol = function (v) { var c = this.p & C; this.p = (this.p & ~C) | ((v >> 7) & 1); return this.nz(((v << 1) | c) & 0xFF); };
  P.ror = function (v) { var c = this.p & C; this.p = (this.p & ~C) | (v & 1); return this.nz((v >> 1) | (c << 7)); };

  P.branch = function (cond) {
    var o = this.rd(this.pc++);
    if (cond) {
      if (o & 0x80) o -= 256;
      var t = (this.pc + o) & 0xFFFF;
      this.cycles += ((t ^ this.pc) & 0xFF00) ? 2 : 1;
      this.pc = t;
    }
  };

  // Read-modify-write. The real 6502 writes the old value back first; that
  // dummy write is left out so I/O registers with write side effects (VDC
  // data, SID) see one write per instruction.
  P.rmw = function (a, f) { var v = this.rd(a); this.wr(a, f.call(this, v)); };

<script>
// Label-based hooks on the running 8502 code.
//
//   hooks.trace('PLOTPIX')                      count calls per frame
//   hooks.port('PLOTPIX', fn, 'verify')         run the JS port AND the original,
//                                               compare registers + memory writes
//   hooks.port('PLOTPIX', fn, 'replace')        run only the JS port, then RTS
//
// A port is a function of a context:  ctx.a/x/y (in and out), ctx.rd(addr),
// ctx.wr(addr, v) (buffered), ctx.sym('NAME'), ctx.cycles (estimate, optional).
// Verify mode is how routines migrate from 6502 to JS without trusting either:
// the original keeps running, and every call checks the port against it.
'use strict';

var SentinelHooks = (function () {

  function Hooks(machine, symbols) {
    this.m = machine;
    this.symbols = symbols;
    this.at = new Uint8Array(0x10000);
    this.handlers = {};               // addr -> handler
    this.watches = {};                // return addr -> [pending verification]
    this.mismatches = [];
    this.onMismatch = null;
    machine.hooks = this;
  }

  var P = Hooks.prototype;

  // A label, or an address as a number / '$1234'.
  P.addr = function (name) {
    if (typeof name === 'number') return name & 0xFFFF;
    var a = this.symbols[name];
    if (a === undefined && /^\$[0-9a-f]{1,4}$/i.test(name)) a = parseInt(name.slice(1), 16);
    if (a === undefined) throw new Error('unknown label ' + name);
    return a;
  };

  // Label for an address (for the debugger), or null.
  P.labelOf = function (a) {
    if (!this.byAddr) {
      this.byAddr = {};
      for (var n in this.symbols) if (!(this.symbols[n] in this.byAddr)) this.byAddr[this.symbols[n]] = n;
    }
    return this.byAddr[a] || null;
  };

  P.handler = function (name) {
    var a = this.addr(name), h = this.handlers[a];
    if (!h) {
      if (typeof name === 'number' || name[0] === '$') name = this.labelOf(a) || '$' + ('000' + a.toString(16).toUpperCase()).slice(-4);
      h = this.handlers[a] = { name: name, addr: a, mode: 'trace', fn: null, listeners: [],
                               calls: 0, callsLastFrame: 0, verified: 0, failed: 0 };
      this.at[a] = 1;

    return h;
  };

  // The C64 original blanks the display with LDA $D011 / AND #$EF / ORA #$20 / STA $D011
  // at $2475 (restart) and $8D9A (arrival after a destroyed mothership). The read returns
  // the raster's bit 8 in bit 7, and the write stores it as the raster compare's bit 8.
  // Done on a line >= 256 (the main thread is there about a quarter of the time) it moves
  // the IRQ chain's compare to line 256+: the chain never fires again, the display stays
  // off and the game goes on blind (black screen, even the win screen is never seen).
  // The same code at the same line would do this on any VIC-II; the fix is to keep the
  // compare bit that is stored instead of the raster's: the instruction sequence is done
  // here with that bit masked. Page only: the tests run the original unchanged.
  P.fixC64Original = function () {
    var m = this.m;
    function blank(next) {
      return function () {
        var c = m.cpu, v = ((m.vic[0x11] & 0x7F) & 0xEF) | 0x20;
        m.vicWrite(0x11, v);
        c.a = v; c.nz(v); c.cycles += 12; c.pc = next;

    this.on(0x8D9A, blank(0x8DA4));
    return this;
  };

  P.trace = function (name) { this.handler(name); return this; };

  // Call fn(machine, handler) every time the routine is entered (events, cheats).
  // fn can stop the machine: m.breakRequest = {type: 'event', ...}.
  P.on = function (name, fn) { this.handler(name).listeners.push(fn); return this; };
  P.off = function (name, fn) {

  };

  // like 'no damage'. mode 'off' turns it back on.

  function Ctx(hooks, cpu) {

  P.enter = function (pc) {
    var m = this.m, cpu = m.cpu;
    if (this.watches[pc]) this.checkReturn(pc);
    var h = this.handlers[pc];
    if (!h) { cpu.step(); return; }
    h.calls++;
    for (var i = 0; i < h.listeners.length; i++) h.listeners[i](m, h);
    if (!h.fn || h.mode === 'trace' || h.mode === 'off' || m.writeLog) { cpu.step(); return; }

    var ctx = new Ctx(this, cpu);
    h.fn(ctx);

    if (h.mode === 'replace') {
      ctx.writes.forEach(function (v, a) { m.write(a, v); });
      cpu.a = ctx.a & 0xFF; cpu.x = ctx.x & 0xFF; cpu.y = ctx.y & 0xFF;
      cpu.nz(cpu.a);
      cpu.pc = ((cpu.pull() | (cpu.pull() << 8)) + 1) & 0xFFFF;   // RTS
      cpu.cycles += ctx.cycles || 12;
      return;
    }

    // verify: remember what the port predicts, run the original, compare on return
    var ret = ((m.ram[0x100 | ((cpu.sp + 1) & 0xFF)] | (m.ram[0x100 | ((cpu.sp + 2) & 0xFF)] << 8)) + 1) & 0xFFFF;
    var w = { h: h, sp: (cpu.sp + 2) & 0xFF, entrySp: cpu.sp, ctx: ctx };
    (this.watches[ret] = this.watches[ret] || []).push(w);
    this.at[ret] = 1;
    m.writeLog = [];
    cpu.step();
  };

  P.checkReturn = function (pc) {
    var m = this.m, cpu = m.cpu, list = this.watches[pc];
    for (var i = list.length - 1; i >= 0; i--) {
      var w = list[i];
      if (w.sp !== cpu.sp) continue;
      list.splice(i, 1);
      var ctx = w.ctx, diffs = [];
      ['a', 'x', 'y'].forEach(function (r) {
        if ((ctx[r] & 0xFF) !== cpu[r]) diffs.push(r.toUpperCase() + ' port=' + hex(ctx[r] & 0xFF) + ' 6502=' + hex(cpu[r]));
      });
      // the routine's own stack traffic (JSR/PHA below the caller's stack) is scratch
      var seen = new Set((m.writeLog || []).filter(function (a) {
        return !(a >= 0x100 && a <= (0x100 | w.entrySp));
      }));
      ctx.writes.forEach(function (v, a) {
        if (!seen.has(a)) diffs.push('$' + hex4(a) + ' written by port only');
        else if (m.read(a) !== v) diffs.push('$' + hex4(a) + ' port=' + hex(v) + ' 6502=' + hex(m.read(a)));
      });
      seen.forEach(function (a) {
        if (!ctx.writes.has(a)) diffs.push('$' + hex4(a) + ' written by 6502 only');
      });
      m.writeLog = null;
      if (diffs.length) {
        w.h.failed++;
        var rec = { name: w.h.name, frame: m.frame, diffs: diffs };
        if (this.mismatches.length < 50) this.mismatches.push(rec);
        if (this.onMismatch) this.onMismatch(rec);

        w.h.verified++;
      }

      delete this.watches[pc];

  function hex4(v) { return ('000' + v.toString(16).toUpperCase()).slice(-4); }

})();

<script>
// Score and hi-score of the game. The original has no point score: its end screen shows only a
// rank name and a class digit, both results of its rating routine ($F440, the C128 port's
// ENDRATING). The page's score is built from what the game counts (see js/README.md):
//
//     points = 100 * enemy motherships destroyed                 (0-4, the orange corners of the map)
//            + 10 * (difficulty + 1) * enemy fighters destroyed   (difficulty 0-4)
//   and only after a victory:
//            + 100 * friendly bases still standing                (0-4, the blue ones, "BASE STATIONS")
//            + remaining seconds out of 6000 (100 minutes)        (C64 original only: the C128 port keeps no clock)
//   (a loss earns neither, so dying early with nothing done scores 0)
//
// The rank and class on the end screen are the game's own (rate / rating below work them out the
// way the original does; the tests check the hooks against them). Pure logic (no DOM), so the
// headless tests drive it.
'use strict';

var SentinelHiscore = (function () {
  var CAP = [3, 4, 5, 6, 7];                     // $F5B3: the highest rank per difficulty
  var RANKS = ['SPACE DROID', 'TRAINEE', 'LIEUTENANT', 'CAPTAIN', 'COMMANDER', 'ADMIRAL', 'SENTINEL', 'STAR SENTINEL'];
  var KEY = 'sentinel-itch-hi-';
  var ORANGE = [0, 9, 50, 59], BLUE = [12, 17, 42, 47];   // map cells (6 rows of 10) of the 4 corner motherships / 4 bases ($2089 / $2085)
  var TIME_MAX = 6000;                                     // seconds: 100 minutes
  var PER_MOTHER = 100, PER_BASE = 100, PER_KILL = 10;

  // The tail of $F440: the 16 bit rating (lo = $F43D, hi = $F43E) to rank, class, value.
  function rate(lo, hi, diff) {
    var cap = CAP[Math.max(0, Math.min(4, diff | 0))], x, l = lo & 255, d = (hi & 255) - 0x80;
    if (d < 0) { x = 0; l = 0; }
    else if (d >= cap) { x = cap; l = 255; }
    else x = d;
    return { x: x, lo: l, cls: l >> 5, value: x * 256 + l };
  }

  // $F440 itself: the rating from the game's statistics, to the 16 bit value it leaves in
  // $F43D/$F43E. All arithmetic as the 8 bit code does it (it truncates in places).
  //   diff      difficulty 0-4 ($E0)               victory  the game was won ($F34B)
  //   planet    JARALOBA was lost ($F431)          hits     hits taken ($F432, 16 bit)
  //   kills     $F434 (16 bit)                     energy   $F436 (24 bit)
  //   protons   $F439 (16 bit)                     shots    $F43B (16 bit)
  //   mothers   enemy motherships destroyed (corner states other than $80)
  //   bases     friendly bases lost (base states other than $FF)

    function add16(v) { t = lo + (v & 255); lo = t & 255; hi = (hi + ((v & 0xFFFF) >> 8) + (t >> 8)) & 255; }

    sub16((i.protons << 3) & 0xFFFF);

  // destroyed), victory (the game was won), bases (friendly bases left) and elapsed (seconds on the
  // game's clock; null / undefined when the program keeps none: that term is then 0): those two count
  // only after a victory. Returns {points, parts}.

    return { points: sc.points, text: pad6(sc.points), parts: sc.parts, rank: idx, name: RANKS[idx] || '', cls: (r.cls ^ 7) + 1, victory: !!victory };

  // Storage that throws or is missing keeps the scores in memory for the session.
  function Store(storage) { this.s = storage || null; this.mem = {}; }
  Store.prototype.get = function (prog) {
    var v = null;
    try { if (this.s) v = this.s.getItem(KEY + prog); } catch (e) { v = null; }
    if (v === null || v === undefined) v = this.mem[prog];

  };

  Store.prototype.submit = function (prog, points) {

  };

  // Calls onEnd(result) once per game over of the running program, at the moment the end screen's
  // rank is worked out. Returns {rearm()} (call it after loading a state taken before the end).
  //   c64game  $F3CE (just before JSR $F440, which uses up the counters): the statistics are read there:
  //            $F434 kills (it counts from 1), the map at $033C. The clock has no variable (only the HUD
  //            digits, which wrap at 60:00 and are cleared by the death scene), so the seconds are counted:
  //            $FAE9 is reached once per game second (from 0 at GAMEENTRY; after a state is loaded,
  //            rearm() starts from the HUD digits). The instruction after $F440 ($F3D1) has
  //            $F43D/$F43E (the rating), $E0 the difficulty, $F34B the victory flag; the game restarts
  //            at GAMEENTRY.
  //   game     the C128 port's ENDRANKSET (label end_rankok, inside the ENDING overlay package, so only
  //            while OVOWNER says that package is loaded): ENDSCORE, DIFF, ENDMODE (2 = victory), ENDRANK
  //            (the name already chosen). The statistics are read after ENDRATINGINPUT (ENDRANKSET + 3):
  //            ENDKILLS (from 1 as well), the map M_STATE, and HUDTIME plus CLOCKHOURS. The reset is ENDRESET.

      hooks.on('GAMEENTRY', function () { done = false; pre = null; secs = 0; });

      hooks.on(sym.ENDRANKSET + 3, function () {

        if (R[sym.OVOWNER] !== 0x40) return;
        var c = mapCounts(function (a) { return R[sym.M_STATE + a]; });
        var elapsed = null;
        if (sym.HUDTIME !== undefined && sym.CLOCKHOURS !== undefined) {
          elapsed = hudSeconds(R, sym.HUDTIME);
          if (elapsed !== null) elapsed += R[sym.CLOCKHOURS] * 3600;
        }
        pre = { diff: R[sym.DIFF], kills: (R[sym.ENDKILLS] | (R[sym.ENDKILLS + 1] << 8)) - 1, mothers: c.mothers, bases: c.bases, elapsed: elapsed };
      });
      hooks.on('end_rankok', function () {
        var R = m.ram;

        onEnd(result(R[sym.ENDSCORE], R[sym.ENDSCORE + 1], R[sym.DIFF], R[sym.ENDMODE] === 2, R[sym.ENDRANK], pre));

})();

<script>
// Frame pacing of a display tick (requestAnimationFrame): how many emulated frames to run.
// Pure logic (no DOM, no clock of its own), so the headless tests drive it.
//
// Normal speed: the elapsed time goes into an accumulator and one frame runs per 20 ms of it.
// Fast (the C64 original's unpacker, up to GAMEENTRY) and the 2x / 5x speeds: as many frames as
// fit in a time budget of the tick. Two things the page once got wrong, a stall of 10+ seconds at the
// C64 title (the unpacker's end is found by a hook INSIDE a frame):
//   - the tick's frames were charged to the accumulator by "fast is now off", although they were run
//     in the fast mode, which does not use it: a debt of 175 frames = 3.5 s (and up to 1000 = 20 s) of
//     time without a frame;
//   - the rest of the tick's 1000 frames then ran with no time budget at all.
// Now a tick is one mode from start to end: when the fast mode ends inside it the tick stops and
// the next one begins at normal speed with an empty accumulator.
'use strict';

var SentinelPacing = (function () {
  var FRAME_MS = 1000 / 50, FAST_FRAMES = 1000;

  function Pacer(frameMs) { this.frameMs = frameMs || FRAME_MS; this.acc = 0; }

  Pacer.prototype.reset = function () { this.acc = 0; };

  // One tick. dt: ms since the last tick; c: {speed (1, 2, 5), isFast() (read while running),
  // frame() (one emulated frame; false when the program has stopped), now() (ms), budgetMs}.
  // Returns {ran, stopped}.
  Pacer.prototype.tick = function (dt, c) {
    var fast = c.isFast(), speed = c.speed, n, ran = 0, stopped = false;
    var throttled = fast || speed > 1, end = c.now() + c.budgetMs;
    if (fast) { n = FAST_FRAMES; this.acc = 0; }
    else { this.acc = Math.min(this.acc + dt * speed, this.frameMs * 4 * speed); n = Math.floor(this.acc / this.frameMs); }
    for (var i = 0; i < n; i++) {
      if (!c.frame()) { stopped = true; break; }
      ran++;
      if (throttled && c.now() > end) break;
      if (fast && !c.isFast()) break;           // the fast mode ended in this frame
    }
    if (!fast) this.acc -= ran * this.frameMs;
    return { ran: ran, stopped: stopped };
  };

  return { Pacer: Pacer, FRAME_MS: FRAME_MS, FAST_FRAMES: FAST_FRAMES };
})();

if (typeof module !== 'undefined') module.exports = SentinelPacing;

    this.sync = true;

'use strict';

var SentinelInput = (function () {
  var JOY = { ArrowUp: 1, ArrowDown: 2, ArrowLeft: 4, ArrowRight: 8, ControlRight: 16, Numpad0: 16 };

    this.onMode = onMode;
    this.joy = new Set();
    this.buttons = new Map();
    this.dx = this.dy = 0;
    this.sampledMode = null;
    if (this.exclusive) {
      m.mouse.present = false;

        // at a device change so even $00/$7E <-> $FF is detected without a jump.

            m.ram[s.OLDY] = self.baseY;

        } else {
          m.ram[s.OPOTX] = mouse ? self.baseX : 0xFF;
          m.ram[s.OPOTY] = mouse ? self.baseY : 0;

        }

  Input.prototype.baseline = function () {
    this.baseX = this.m.mouse.x << 1;
    this.baseY = (this.m.mouse.y << 1) ^ 0xFF;
  };

  Input.prototype.select = function (mode) {
    if (!this.exclusive || this.mode === mode) return;

<script>
// The minimal page (js/dist/itch.html, for itch.io): a C64 / C128 selector, then the game
// on the same canvas, with an overlay for the few messages, touch controls, hotkeys, quick
// save / load and the hi-scores. No debugger. See js/README.md ("The itch.io page").
//
//   M mute | Alt+W 5x | Alt+Q 2x | Ctrl+S quick save | Ctrl+L quick load | Ctrl+R back to the selector
//   Tab = the C= key (opens the map); Alt alone does nothing in the game
'use strict';

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var Video = SentinelVideo, HI = SentinelHiscore, Font = SentinelFont;

  var CONFIG = {
    dma: false,             // the VIC takes its bus cycles, as on the real chip (the timing tests run so)
    sens: 0.5,              // mouse counts per pixel of pointer movement
    touchSens: 0.9,         // touch: counts per game pixel dragged
    overlayMs: 3000,        // how long a message stays, then it fades
    backAlpha: 0.55,        // the dark box behind each overlay text block
    fadeMs: 700,
  };

  // C128's start-up screen (light green border and text on a dark gray background)
  var LIGHT_BLUE = 0xFFB55E6C, BLUE = 0xFF792835, LIGHT_GREEN = 0xFF84D29A, DARK_GRAY = 0xFF444444;     // $0E, $06 and $00 as 0xAABBGGRR

  var SCHEME_C128 = { border: LIGHT_GREEN, bg: DARK_GRAY, fg: LIGHT_GREEN };   // the C128's start-up screen: light green border and text, dark gray background
  var MENU = [
    { label: 'C64', prog: 'c64game', scheme: SCHEME_C64 },
    { label: 'C128', prog: 'game', scheme: SCHEME_C128 },
  ];

  // Commodore key matrix: [column (CIA1 port A bit), row (port B bit)]

    Backspace: [0, 0], Enter: [0, 1], F7: [0, 3], F1: [0, 4], F3: [0, 5], F5: [0, 6],
    Digit3: [1, 0], KeyW: [1, 1], KeyA: [1, 2], Digit4: [1, 3], KeyZ: [1, 4], KeyS: [1, 5], KeyE: [1, 6], ShiftLeft: [1, 7],
    Digit5: [2, 0], KeyR: [2, 1], KeyD: [2, 2], Digit6: [2, 3], KeyC: [2, 4], KeyF: [2, 5], KeyT: [2, 6], KeyX: [2, 7],
    Digit7: [3, 0], KeyY: [3, 1], KeyG: [3, 2], Digit8: [3, 3], KeyB: [3, 4], KeyH: [3, 5], KeyU: [3, 6], KeyV: [3, 7],
    Digit9: [4, 0], KeyI: [4, 1], KeyJ: [4, 2], Digit0: [4, 3], KeyM: [4, 4], KeyK: [4, 5], KeyO: [4, 6], KeyN: [4, 7],

    overlay.draw();
  }

  // One emulated frame. False when the program has stopped (the page goes back to the selector).
  function oneFrame() {
    if (pauseFrames) {
      input.release();
      setKeyCode('F1', true);
    }
    input.feed();
    var r = m.run();
    if (r === 'frame') {
      if (pauseFrames && (m.ram[prog.symbols.PAUSED ?? 0x9f] || --pauseFrames === 0)) {
        pauseFrames = 0;
        setKeyCode('F1', false);
      }
      if (!fast && speed === 1) audio.frame(m, audioFrame++ * 19656);
      return true;
    }
    overlay.show('tl', ['STOPPED'], { scale: 2 });
    showMenu();
    return false;
  }

  function setSpeed(s) {
    if (s === speed) return;
    speed = s; pacer.reset();
    $('b-go').classList.toggle('down', speed === 2);
    audio.silence();                        // the SID log is only played at normal speed
    if (speed === 1) overlay.clear('bottom'); else overlay.show('bottom', [speed === 2 ? '>>' : '>>>>>'], { scale: 2, sticky: true });
  }

  // ---- quick save / load -----------------------------------------------------------------

  var SAVE_KEY = 'sentinel-itch-state-';
  function buildSig() {                       // a state is only loaded into the build that saved it
    var s = prog.prg, h = 2166136261;
    for (var i = 0; i < s.length; i += 7) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return 'v1-' + (h >>> 0).toString(16);
  }
  var memSaves = {};                          // where the browser gives no storage (a sandboxed frame): this visit only
  function quickSave() {
    if (scene !== 'game' || !m) return;
    var text;
    try { text = buildSig() + '|' + m.stateToText(); } catch (e) { overlay.show('tl', ['SAVE FAILED'], { scale: 2 }); return; }
    memSaves[progName] = text;
    try { window.localStorage.setItem(SAVE_KEY + progName, text); } catch (e) { /* kept in memory */ }
    overlay.show('tl', ['SAVED'], { scale: 2 });
  }
  function quickLoad() {
    if (scene !== 'game' || !m) return;
    var t = null, sig = buildSig();
    try { t = window.localStorage.getItem(SAVE_KEY + progName); } catch (e) { t = null; }
    if (!t || t.indexOf(sig + '|') !== 0) t = memSaves[progName] || null;
    if (!t || t.indexOf(sig + '|') !== 0) { overlay.show('tl', ['NO SAVE'], { scale: 2 }); return; }
    try {
      m.loadState(m.stateFromText(t.slice(sig.length + 1)));
      m.stopped = null; fast = false;
      releaseAll();
      input.afterLoad();
      audio.reset(audioFrame * 19656);
      if (watcher) watcher.rearm();
      overlay.show('tl', ['LOADED'], { scale: 2 });
    } catch (e) { overlay.show('tl', ['LOAD FAILED'], { scale: 2 }); }
  }

  // ---- overlay: big white pixel text over the game ------------------------------------------
  // Slots include 'tl' (hotkeys and pointer hint), 'mode' (input), 'top' (score), and 'bottom' (speed).

  var overlay = (function () {
    var slots = {}, w = 0, h = 0, dirty = false, backings = [];
    function resize() {
      var r = box.getBoundingClientRect(), d = window.devicePixelRatio || 1;
      w = Math.max(1, Math.round(r.width * d)); h = Math.max(1, Math.round(r.height * d));
      if (ovc.width !== w || ovc.height !== h) { ovc.width = w; ovc.height = h; }
      dirty = true;
    }
    // lines: strings (at o.scale, default 2 = 16 game pixels tall) or [string, scale]
    function show(slot, lines, o) {
      o = o || {};
      slots[slot] = { lines: lines.map(function (l) { return typeof l === 'string' ? [l, o.scale || 2] : l; }), sticky: !!o.sticky, plain: !!o.plain, until: performance.now() + CONFIG.overlayMs };
      dirty = true;
    }
    function clear(slot) { if (slots[slot]) { delete slots[slot]; dirty = true; } }
    function glyphs(g, text, x, y, u) {       // one line: x, y in device px of the top-left, u = device px per font pixel
      for (var i = 0; i < text.length; i++) {
        var code = sc(text[i]);
        for (var r = 0; r < 8; r++) {
          var bits = Font.rom[code * 8 + r];
          if (!bits) continue;
          for (var b = 0; b < 8; b++) {
            if (!(bits & (0x80 >> b))) continue;
            var x0 = Math.round(x + (i * 8 + b) * u), y0 = Math.round(y + r * u);
            g.rect(x0, y0, Math.round(x + (i * 8 + b + 1) * u) - x0, Math.round(y + (r + 1) * u) - y0);
          }
        }
      }
    }
    function draw() {
      var now = performance.now(), any = false, name;
      for (name in slots) {
        var s = slots[name];
        if (!s.sticky && now >= s.until + CONFIG.fadeMs) delete slots[name]; else any = true;
      }
      if (!any && !dirty) return;
      if (w === 0) resize();
      ovx.clearRect(0, 0, w, h);
      dirty = any;                            // keep redrawing while something fades
      backings = [];
      var unit = w / Video.VIC_W;             // device px per game pixel
      var cut = document.body.classList.contains('ingame') ? 36 * unit : 0;   // a game shows rows 36-235 of the 272: the rows above are off the box
      // the rows of the slots (game pixels from the top of the box): as in the full picture, or, in a game, below one another at the top
      var rows = cut ? { top: 2, tl: 22, mode: 42 } : { top: 2, tl: 14, mode: 34 };
      for (name in slots) {
        var s2 = slots[name], total = 0, y = 0, us = s2.lines.map(function (l) {
          var u = Math.min(unit * l[1], 0.94 * w / (l[0].length * 8));   // a long line shrinks to fit
          total += 10 * u; return u;
        });
        var alpha = (s2.sticky || now < s2.until) ? 1 : Math.max(0, 1 - (now - s2.until) / CONFIG.fadeMs);
        var y0 = rows[name] !== undefined ? rows[name] * unit : name === 'bottom' ? h - (cut ? 8 : 20) * unit - total : (h - total) / 2;
        var xs = s2.lines.map(function (l, i) {
          var right = w - l[0].length * 8 * us[i];
          return name === 'tl' ? 14 * unit : name === 'mode' ? right - 14 * unit : right / 2;
        });
        // a dark backing behind the whole block, as wide as its widest line, fading with the text
        var bx0 = Infinity, bx1 = -Infinity;
        s2.lines.forEach(function (l, i) { bx0 = Math.min(bx0, xs[i]); bx1 = Math.max(bx1, xs[i] + l[0].length * 8 * us[i]); });
        var pad = Math.max(4, Math.round(unit * 3)), last = us[us.length - 1];
        var back = { slot: name, x: bx0 - pad, y: y0 - pad, w: bx1 - bx0 + 2 * pad, h: total - 2 * last + 2 * pad, alpha: alpha * CONFIG.backAlpha };
        backings.push(back);
        ovx.globalAlpha = back.alpha;
        ovx.fillStyle = '#000';
        ovx.beginPath();
        if (ovx.roundRect) ovx.roundRect(back.x, back.y, back.w, back.h, pad * 1.5); else ovx.rect(back.x, back.y, back.w, back.h);
        ovx.fill();
        ovx.globalAlpha = alpha * 0.95;
        ovx.fillStyle = '#fff'; ovx.shadowBlur = 0;                      // plain text, no glow
        ovx.beginPath();
        for (var li = 0; li < s2.lines.length; li++) {
          glyphs(ovx, s2.lines[li][0], xs[li], y0 + y, us[li]);
          y += 10 * us[li];
        }
        ovx.fill();
      }
      ovx.globalAlpha = 1; ovx.shadowBlur = 0;
    }
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(box);
    return { show: show, clear: clear, draw: draw, resize: resize, backings: function () { return backings; } };
  })();

  // ---- pointer: mouse (captured), touch (drag to aim, buttons) -------------------------------

  // Capturing the mouse can be refused (a sandboxed frame, no focus, a browser without it): after two
  // requests that came to nothing the page uses the plain pointer instead.
  var lockPending = false, lockFails = 0;
  function lockFailed() {
    if (!lockPending) return;
    lockPending = false;
    if (++lockFails >= 2) noLock = true;
  }
  function lockPointer() {
    if (noLock || document.pointerLockElement === canvas) return;
    if (!canvas.requestPointerLock) { noLock = true; return; }
    lockPending = true;
    try { var p = canvas.requestPointerLock(); if (p && p.catch) p.catch(lockFailed); } catch (e) { lockFailed(); }
    setTimeout(lockFailed, 600);
  }
  document.addEventListener('pointerlockerror', lockFailed);
  document.addEventListener('pointerlockchange', function () {
    if (document.pointerLockElement === canvas) {
      lockPending = false; lockFails = 0;
      overlay.show('tl', ['ESC - RELEASE MOUSE'], { scale: 2, plain: true });
    } else if (input) input.clearButtons('mouse');
  });

  function setTouch(on) {
    if (touch === on) return;
    touch = on; document.body.classList.toggle('touch', on);
  }
  try { if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) setTouch(true); } catch (e) { /* ignore */ }

  var aim = null;                             // the touch that drags the crosshair
  stage.addEventListener('pointerdown', function (e) {
    try { window.focus(); } catch (err) { /* ignore */ }
    if (e.pointerType === 'touch' || e.pointerType === 'pen') setTouch(true);
    if (scene === 'game' && e.pointerType !== 'mouse' && !aim) {
      aim = { id: e.pointerId, x: e.clientX, y: e.clientY };
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    }
  });
  // Unlike pointerdown/up, mouse events report each button in a chord.
  stage.addEventListener('mousedown', function (e) {
    if (!input || scene !== 'game' || (e.button !== 0 && e.button !== 2)) return;
    if (document.pointerLockElement !== canvas && !noLock) {
      lockPointer();
      if (!input.mode) { e.preventDefault(); return; }
    }
    input.setButton('mouse', e.button === 0 ? 'left' : 'right', true);
    e.preventDefault();
  });
  window.addEventListener('mouseup', function (e) {
    if (input && (e.button === 0 || e.button === 2)) input.setButton('mouse', e.button === 0 ? 'left' : 'right', false);
  });
  window.addEventListener('pointerup', function (e) {
    if (aim && aim.id === e.pointerId) aim = null;
  });
  window.addEventListener('pointercancel', function (e) { if (aim && aim.id === e.pointerId) aim = null; });
  stage.addEventListener('pointerdown', function (e) {       // touch: the touched entry shows its colours at once
    if (scene !== 'menu' || e.pointerType === 'mouse') return;
    var n = menuHit(e.clientX, e.clientY);
    if (n !== null && n !== sel) { sel = n; drawMenu(); }
  });
  stage.addEventListener('pointermove', function (e) {
    if (scene === 'menu' && e.pointerType === 'mouse') {
      var n = menuHit(e.clientX, e.clientY);
      if (n !== null && n !== sel) { sel = n; drawMenu(); }
      return;
    }
    if (aim && aim.id === e.pointerId && scene === 'game') {
      var k = Video.VIC_W / (box.getBoundingClientRect().width || Video.VIC_W) * CONFIG.touchSens;
      input.move((e.clientX - aim.x) * k, (aim.y - e.clientY) * k);
      aim.x = e.clientX; aim.y = e.clientY;
      e.preventDefault();
    }
  });
  document.addEventListener('mousemove', function (e) {
    if (scene !== 'game' || !m) return;
    if (document.pointerLockElement === canvas || (!document.pointerLockElement && (noLock || input.mode) && stage.contains(e.target))) {
      input.move(e.movementX * CONFIG.sens, -e.movementY * CONFIG.sens);
    }
  });
  stage.addEventListener('click', function (e) {
    if (scene !== 'menu') return;
    var n = menuHit(e.clientX, e.clientY);
    if (n !== null) { sel = n; startGame(MENU[n].prog, !touch); }   // (a click may capture the mouse)
  });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // touch buttons: FIRE = left, MAP = right, PROTON = both (the mouse buttons, as the game reads them)
  [['fire', 'left'], ['map', 'right'], ['proton', 'both']].forEach(function (b) {
    var el = $('b-' + b[0]);
    function dn(e) { e.preventDefault(); e.stopPropagation(); try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } if (input) input.setButton(el, b[1], true); el.classList.add('down'); audioGesture(); }
    function up(e) { e.preventDefault(); if (input) input.setButton(el, b[1], false); el.classList.remove('down'); }
    el.addEventListener('pointerdown', dn);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
  });

  // PAUSE = the game's own F1 pause (any aim movement resumes); >> toggles 2x speed (tap on, tap off)
  function tapButton(id, fn) {
    var el = $(id);
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); audioGesture(); if (scene === 'game' && m) fn(el); });
    el.addEventListener('click', function (e) { e.preventDefault(); });
  }
  tapButton('b-pause', function () {
    if (!m.ram[prog.symbols.PAUSED ?? 0x9f]) pauseFrames = 8;
  });
  tapButton('b-go', function (el) {
    setSpeed(speed === 2 ? 1 : 2);
    el.classList.toggle('down', speed === 2);
  });

  // ---- keyboard --------------------------------------------------------------------------------

  var suppress = { ControlLeft: false };

  function setKeyCode(code, on) {
    var k = KEYS[code];
    if (k && m) m.setKey(k[0], k[1], on);
  }
  function mod(e) { return e.ctrlKey || e.altKey || e.metaKey; }

  // A hotkey was used: the game must not see the modifier that came with it
  function swallowModifiers() {
    suppress.ControlLeft = true;
    setKeyCode('ControlLeft', false);
    if (input) input.setJoystick('ControlRight', false);
  }

  function toggleMute() {
    audio.setMuted(!audio.muted);
    overlay.show('tl', [audio.muted ? 'MUTE ON' : 'MUTE OFF'], { scale: 2 });
  }

  function audioGesture() { if (!audio.running()) audio.start(); }
  ['keydown', 'pointerdown', 'pointerup', 'touchend', 'click'].forEach(function (n) {
    window.addEventListener(n, audioGesture, true);
  });

  window.addEventListener('keydown', function (e) {
    var code = e.code;
    // hotkeys (always: the browser's own meaning is cancelled)
    if (e.ctrlKey && !e.altKey && !e.metaKey && (code === 'KeyS' || code === 'KeyL' || code === 'KeyR')) {
      e.preventDefault();
      if (e.repeat) return;
      if (scene === 'game') {
        swallowModifiers();
        if (code === 'KeyS') quickSave(); else if (code === 'KeyL') quickLoad();
        else { overlay.show('tl', ['RESET'], { scale: 2 }); showMenu(); }
      }
      return;
    }
    if (e.altKey && !e.ctrlKey && !e.metaKey && (code === 'KeyW' || code === 'KeyQ')) {
      e.preventDefault();
      if (e.repeat || scene !== 'game') return;
      swallowModifiers();
      setSpeed(code === 'KeyW' ? (speed === 5 ? 1 : 5) : (speed === 2 ? 1 : 2));
      return;
    }
    if (code === 'KeyM' && !mod(e)) {
      e.preventDefault();
      if (!e.repeat) toggleMute();
      return;
    }
    if (scene === 'menu') {
      var handled = true;
      if (code === 'ArrowUp') { sel = (sel + MENU.length - 1) % MENU.length; drawMenu(); }
      else if (code === 'ArrowDown') { sel = (sel + 1) % MENU.length; drawMenu(); }
      else if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space' || code === 'ControlRight' || code === 'Numpad0') {
        if (!e.repeat) startGame(MENU[sel].prog, false);
      }
      else if (code === 'Digit1' || code === 'Numpad1') { sel = 0; startGame(MENU[0].prog, false); }
      else if (code === 'Digit2' || code === 'Numpad2') { sel = 1; startGame(MENU[1].prog, false); }
      else handled = false;
      if (handled) e.preventDefault();
      return;
    }
    if (!m) return;
    if (SentinelInput.isJoystick(code)) { input.setJoystick(code, true, e.repeat); e.preventDefault(); return; }
    if (code === 'AltLeft' || code === 'AltRight') { e.preventDefault(); return; }   // Alt alone does nothing (the hotkeys use it)
    if (!KEYS[code]) return;
    if (code === 'Tab' && mod(e)) return;    // Tab is the C= key; Ctrl+Tab and friends stay the browser's
    e.preventDefault();
    if (suppress[code]) return;
    setKeyCode(code, true);
  });

  window.addEventListener('keyup', function (e) {
    var code = e.code;
    if (code === 'AltLeft' || code === 'AltRight') { e.preventDefault(); return; }
    if (code === 'ControlLeft') suppress.ControlLeft = false;
    if (!m) return;
    if (SentinelInput.isJoystick(code)) { input.setJoystick(code, false); return; }
    if (KEYS[code]) setKeyCode(code, false);
  });

  function releaseAll() {
    suppress.ControlLeft = false;
    aim = null;
    if (m) { m.keys.fill(0); input.release(); }
    ['fire', 'map', 'proton'].forEach(function (n) { $('b-' + n).classList.remove('down'); });
  }
  function backgroundGame() {
    releaseAll();
    if (scene === 'game' && m && !m.ram[prog.symbols.PAUSED ?? 0x9f]) {
      pauseFrames = 8;
      while (m && pauseFrames && oneFrame()) { /* let the native keyboard scan latch F1 */ }
    }
    audio.silence();
  }
  window.addEventListener('blur', function () { blurred = true; backgroundGame(); });
  window.addEventListener('focus', function () { blurred = false; last = 0; });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) backgroundGame();
    else { blurred = !document.hasFocus(); last = 0; }
  });

  // ---- go --------------------------------------------------------------------------------------

  overlay.resize();
  drawMenu();
  requestAnimationFrame(tick);

  window.SentinelItch = {           // for tests and the console
    state: function () { return { scene: scene, prog: progName, inputMode: input ? input.mode : null, speed: speed, fast: fast, frame: m ? m.frame : 0, audio: audio.kind, running: audio.running(), touch: touch }; },
    overlay: overlay, audio: audio, store: store, machine: function () { return m; }, start: startGame, menu: showMenu,
    frames: function (n) {          // n emulated frames at once, then draw (a page whose animation frames are throttled)
      for (var i = 0; i < n && m; i++) if (!oneFrame()) return;
      if (m) { px.set(m.video.px); ctx.putImageData(img, 0, 0); }
      overlay.draw();
    },
  };
})();

</script>
</body>
</html>
